name: Update contribution card

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/update-contribution.mjs"
      - ".github/workflows/update-contribution.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate contribution card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAYA_LOGINS: "Playa-0v0"
          CYRENE_BOT_LOGINS: "CyreneBot"
        run: node scripts/update-contribution.mjs

      - name: Commit updated card
        shell: bash
        run: |
          if git diff --quiet -- assets/contribution.svg; then
            echo "Contribution card is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution.svg
          git commit -m "chore: update contribution statistics"
          git push
